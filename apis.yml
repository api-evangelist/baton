name: Baton
description: Baton is a supply-chain and logistics technology company that operates as Ryder System's
  Silicon Valley innovation lab following its 2022 acquisition. Founded in 2019 out of 8VC's build
  program, Baton originally built a network of freight "drop zones" that let long-haul truckers hand
  off loads for local pickup and delivery, coordinating vehicles, drop zones, warehouses, and local
  drivers. Today the team builds RyderShare, a collaborative logistics platform combining real-time
  supply-chain visibility with exception management across shipments in transit. As of this enrichment
  pass, baton.io publishes no public developer API, SDK, documentation, or integration surface (the
  site exposes only marketing and careers pages); this profile is maintained for network discovery.
